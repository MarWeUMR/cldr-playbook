  tasks:
    - name: Set sssd to enumerate users and groups
      lineinfile:
        path: /etc/sssd/sssd.conf
        insertafter: "^\\[domain/.+\\]"
        regexp: "^enumerate"
        line: "enumerate = True"
      when: "krb5_kdc_type == 'Red Hat IPA' and 'krb5_server' in groups"
      notify:
        - restart sssd
  handlers:
    - name: restart sssd
      service:
        name: sssd
        state: restarted
